<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Proofdown WASM Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      textarea { width: 100%; height: 10rem; font-family: monospace; }
      pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    </style>
  </head>
  <body>
    <h1>Proofdown WASM Demo</h1>
    <p>Build the WASM with:<br>
      <code>cargo build -p proofdown_wasm --no-default-features --features wasm --target wasm32-unknown-unknown</code>
    </p>
    <div class="row">
      <div>
        <h3>Input</h3>
        <textarea id="input"># Title\n\n<card title="T" /></textarea>
        <button id="parse">Parse</button>
      </div>
      <div>
        <h3>Output</h3>
        <pre id="out">(result)</pre>
      </div>
    </div>

    <script type="module">
      import init, { wasm_parse } from './pkg/proofdown_wasm.js';

      async function main() {
        await init();
        const btn = document.getElementById('parse');
        const input = document.getElementById('input');
        const out = document.getElementById('out');
        btn.addEventListener('click', () => {
          try {
            const resultJson = wasm_parse(input.value);
            const obj = JSON.parse(resultJson);
            out.textContent = JSON.stringify(obj, null, 2);
          } catch (e) {
            out.textContent = JSON.stringify({ ok: false, err: { code: 'JS', msg: String(e) } }, null, 2);
          }
        });
      }

      main().catch(err => console.error(err));
    </script>
  </body>
</html>
