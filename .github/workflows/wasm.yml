name: WASM Build

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: Wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build proofdown_wasm (wasm32)
        run: cargo build -p proofdown_wasm --no-default-features --features wasm --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl -sL https://rustwasm.github.io/wasm-pack/installer/init.sh -o /tmp/init.sh
          bash /tmp/init.sh -f
      - name: Build with wasm-pack (web target)
        run: wasm-pack build crates/proofdown_wasm --target web --out-dir examples/wasm/pkg --release
      - name: Build with wasm-pack (node target)
        run: wasm-pack build crates/proofdown_wasm --target nodejs --out-dir examples/wasm/pkg-node --release
      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: Optimize wasm with wasm-opt
        run: |
          wasm-opt -Oz -o examples/wasm/pkg/proofdown_wasm_bg.opt.wasm examples/wasm/pkg/proofdown_wasm_bg.wasm
      - name: Parity check (WASM vs native)
        shell: bash
        run: |
          set -euo pipefail
          echo -e "# T\n\n<card title=\"T\" />\n" > sample.pml
          cargo run -q -p proofdown_cli -- parse sample.pml --json > native.json
          node -e '
            const fs = require("fs");
            const mod = require("./examples/wasm/pkg-node/proofdown_wasm.js");
            (async () => { await mod.default(); const input = fs.readFileSync("sample.pml", "utf8"); const out = JSON.parse(mod.wasm_parse(input)); fs.writeFileSync("wasm.json", JSON.stringify(out.doc)); })().catch(e => { console.error(e); process.exit(1); });
          '
          # wait a moment for node write
          sleep 1
          diff -u native.json wasm.json
      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-demo
          path: |
            examples/wasm/index.html
            examples/wasm/pkg/
