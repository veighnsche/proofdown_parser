name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint Workflows (actionlint)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test (workspace)
        run: cargo test --workspace --all-features
      - name: Validate JSON Schemas
        run: cargo run -p schema_check -- .specs/schemas

  benches:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build benches
        run: cargo bench -p proofdown_parser --no-run

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for proofdown_wasm crate
        id: check_wasm
        run: |
          if [ -f "crates/proofdown_wasm/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.check_wasm.outputs.exists == 'true' }}
      - name: Add wasm32 target
        if: ${{ steps.check_wasm.outputs.exists == 'true' }}
        run: rustup target add wasm32-unknown-unknown
      - name: Build proofdown_wasm (wasm32)
        if: ${{ steps.check_wasm.outputs.exists == 'true' }}
        run: cargo build -p proofdown_wasm --no-default-features --features wasm --target wasm32-unknown-unknown

  fuzz-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Build fuzz target
        run: cargo fuzz build
      - name: Run fuzz smoke (short)
        env:
          RUST_BACKTRACE: 1
        run: cargo fuzz run parse -- -runs=1000

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse fixtures (CLI JSON)
        run: |
          set -euo pipefail
          for f in crates/proofdown_parser/tests/fixtures/*.pml; do
            echo "Parsing $f"
            cargo run -q -p proofdown_cli -- parse "$f" --json >/dev/null
          done
      - name: Validate minimal fixture (CLI JSON)
        run: |
          cargo run -q -p proofdown_cli -- validate crates/proofdown_parser/tests/fixtures/minimal.pml --json | grep -E '"ok":[[:space:]]*true'

