[package]
name = "proofdown_parser"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
proofdown_ast = { path = "../proofdown_ast" }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "parse_bench"
harness = false
