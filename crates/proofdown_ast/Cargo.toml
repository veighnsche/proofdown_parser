[package]
name = "proofdown_ast"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "serde_bench"
harness = false
